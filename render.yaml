services:
  - type: web
    name: aira-search
    env: python
    plan: free
    region: oregon
    buildCommand: pip install -r requirements.txt && python data/populate_seeds.py
    startCommand: uvicorn server:app --host 0.0.0.0 --port $PORT
    autoDeploy: true
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.8
