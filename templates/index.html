<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Aira Search</title>
    <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>⚡</text></svg>">
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }

        :root {
            --bg-color: #ffffff;
            --text-color: #202124;
            --bar-border: #dfe1e5;
            --bar-shadow: rgba(32, 33, 36, 0.28);
            --btn-bg: #f8f9fa;
            --btn-text: #3c4043;
            --btn-border: #f8f9fa;
            --footer-bg: #f2f2f2;
            --footer-text: #70757a;
            --footer-border: #dadce0;
        }

        @media (prefers-color-scheme: dark) {
            :root {
                --bg-color: #202124;
                --text-color: #e8eaed;
                --bar-border: #5f6368;
                --bar-shadow: rgba(0, 0, 0, 0.45);
                --btn-bg: #303134;
                --btn-text: #e8eaed;
                --btn-border: #303134;
                --footer-bg: #171717;
                --footer-text: #9aa0a6;
                --footer-border: #3c4043;
            }
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-color);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
        }

        /* Top Header Navigation */
        .header {
            display: flex;
            justify-content: flex-end;
            align-items: center;
            padding: 16px 24px;
            gap: 18px;
            font-size: 13px;
        }

        .header a {
            color: var(--text-color);
            text-decoration: none;
            opacity: 0.85;
        }

        .header a:hover {
            text-decoration: underline;
            opacity: 1;
        }

        .avatar {
            width: 32px;
            height: 32px;
            border-radius: 50%;
            background: linear-gradient(135deg, #4285f4, #34a853, #fbbc05, #ea4335);
            display: flex;
            align-items: center;
            justify-content: center;
            color: #fff;
            font-weight: bold;
            font-size: 14px;
        }

        /* Main Search Area */
        .main-content {
            display: flex;
            flex-direction: column;
            align-items: center;
            margin-top: -60px;
            padding: 0 16px;
        }

        .logo {
            font-size: 84px;
            font-weight: 700;
            letter-spacing: -3px;
            margin-bottom: 28px;
            user-select: none;
            display: flex;
            align-items: center;
        }

        .logo .l-blue   { color: #4285f4; }
        .logo .l-red    { color: #ea4335; }
        .logo .l-yellow { color: #fbbc05; }
        .logo .l-green  { color: #34a853; }

        .search-box {
            width: 100%;
            max-width: 584px;
            position: relative;
        }

        .search-bar {
            display: flex;
            align-items: center;
            width: 100%;
            height: 46px;
            border: 1px solid var(--bar-border);
            border-radius: 24px;
            padding: 0 16px;
            transition: all 0.2s ease;
            background: var(--bg-color);
        }

        .search-bar:hover, .search-bar:focus-within {
            box-shadow: 0 1px 6px var(--bar-shadow);
            border-color: transparent;
        }

        .search-icon {
            width: 20px;
            height: 20px;
            fill: #9aa0a6;
            margin-right: 12px;
            flex-shrink: 0;
        }

        .search-input {
            flex: 1;
            border: none;
            outline: none;
            background: transparent;
            font-size: 16px;
            color: var(--text-color);
        }

        .buttons {
            display: flex;
            gap: 12px;
            margin-top: 30px;
        }

        .btn {
            background-color: var(--btn-bg);
            border: 1px solid var(--btn-border);
            border-radius: 4px;
            color: var(--btn-text);
            font-size: 14px;
            padding: 9px 16px;
            cursor: pointer;
            outline: none;
            transition: border-color 0.1s ease, box-shadow 0.1s ease;
        }

        .btn:hover {
            border-color: #dadce0;
            box-shadow: 0 1px 1px rgba(0,0,0,0.1);
        }

        .lang-notice {
            margin-top: 26px;
            font-size: 13px;
            color: var(--footer-text);
        }

        .lang-notice a {
            color: #1a0dab;
            text-decoration: none;
            margin-left: 4px;
        }

        @media (prefers-color-scheme: dark) {
            .lang-notice a { color: #8ab4f8; }
        }

        .lang-notice a:hover {
            text-decoration: underline;
        }

        /* Footer */
        .footer {
            background: var(--footer-bg);
            font-size: 14px;
            color: var(--footer-text);
        }

        .footer-location {
            padding: 14px 24px;
            border-bottom: 1px solid var(--footer-border);
        }

        .footer-links {
            display: flex;
            flex-wrap: wrap;
            justify-content: space-between;
            padding: 12px 24px;
        }

        .footer-left, .footer-right {
            display: flex;
            gap: 20px;
            flex-wrap: wrap;
        }

        .footer a {
            color: var(--footer-text);
            text-decoration: none;
        }

        .footer a:hover {
            text-decoration: underline;
        }

        @media (max-width: 600px) {
            .logo { font-size: 64px; }
            .footer-links { justify-content: center; gap: 16px; }
        }
    </style>
</head>
<body>

    <!-- Header Navigation -->
    <header class="header">
        <a href="https://github.com/adameehanairagroup/AirlysOS" target="_blank">Airlys OS</a>
        <a href="https://github.com/adameehanairagroup/Airalang" target="_blank">AiraLang</a>
        <a href="https://airagroup.technology" target="_blank">Aira Group</a>
        <div class="avatar" title="Er. Adam Eehan">A</div>
    </header>

    <!-- Main Content -->
    <main class="main-content">
        <div class="logo">
            <span class="l-blue">A</span>
            <span class="l-red">i</span>
            <span class="l-yellow">r</span>
            <span class="l-green">a</span>
        </div>

        <div class="search-box">
            <form action="/search" method="get">
                <div class="search-bar">
                    <svg class="search-icon" focusable="false" viewBox="0 0 24 24">
                        <path d="M15.5 14h-.79l-.28-.27A6.471 6.471 0 0 0 16 9.5 6.5 6.5 0 1 0 9.5 16c1.61 0 3.09-.59 4.23-1.57l.27.28v.79l5 4.99L20.49 19l-4.99-5zm-6 0C7.01 14 5 11.99 5 9.5S7.01 5 9.5 5 14 7.01 14 9.5 11.99 14 9.5 14z"></path>
                    </svg>
                    <input class="search-input" type="text" name="q" autocomplete="off" autofocus placeholder="">
                </div>

                <div class="buttons" style="justify-content: center;">
                    <button class="btn" type="submit">Aira Search</button>
                    <button class="btn" type="button" onclick="location.href='/search?q=Airlys+OS+S1'">I'm Feeling Sovereign</button>
                </div>
            </form>
        </div>

        <div class="lang-notice">
            Aira offered in:
            <a href="?hl=ml">മലയാളം</a>
            <a href="?hl=en">English</a>
            <a href="?hl=hi">हिन्दी</a>
            <a href="?hl=ta">தமிழ்</a>
        </div>
    </main>

    <!-- Footer -->
    <footer class="footer">
        <div class="footer-location">
            India • Kerala
        </div>
        <div class="footer-links">
            <div class="footer-left">
                <a href="https://airagroup.technology" target="_blank">About</a>
                <a href="/api/status">Cluster Status</a>
                <a href="https://github.com/adameehanairagroup/Aira-Search" target="_blank">How Search Works</a>
            </div>
            <div class="footer-right">
                <a href="#">Privacy</a>
                <a href="#">Terms</a>
                <a href="#">Settings</a>
            </div>
        </div>
    </footer>

</body>
</html>
